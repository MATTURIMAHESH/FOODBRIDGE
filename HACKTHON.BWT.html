/* ============================================================================
   16. PAGE — DASHBOARD (Donor & NGO)
   ============================================================================ */
function DashboardPage({ user, donations, users, claims }) {
  const [tab, setTab] = useState('overview');

  if (!user) { go('/login'); return null; }

  const isDonor = user.role === 'donor';

  const myDonations = donations.filter(d => d.donorId === user.id);
  const myClaims = donations.filter(d => d.claimedBy === user.id);

  const list = isDonor ? myDonations : myClaims;

  const stats = isDonor
    ? [
        { num: myDonations.length, lbl:'Total donations', icon:'package', tone:'brand' },
        { num: myDonations.filter(d => d.status === 'available').length, lbl:'Live now', icon:'bell', tone:'amber' },
        { num: myDonations.filter(d => d.status === 'completed').length, lbl:'Delivered', icon:'check', tone:'blue' },
        { num: myDonations.filter(d => d.status === 'completed').reduce((s,d) => s + d.serves, 0), lbl:'Meals provided', icon:'heart', tone:'ink' },
      ]
    : [
        { num: myClaims.length, lbl:'Total claims', icon:'heart', tone:'brand' },
        { num: myClaims.filter(d => d.status === 'claimed').length, lbl:'Pending pickup', icon:'truck', tone:'amber' },
        { num: myClaims.filter(d => d.status === 'completed').length, lbl:'Delivered', icon:'check', tone:'blue' },
        { num: myClaims.filter(d => d.status === 'completed').reduce((s,d) => s + d.serves, 0), lbl:'Meals distributed', icon:'users', tone:'ink' },
      ];

  const [tab1, tab2] = isDonor ? ['overview', 'overview'] : ['overview', 'overview'];

  return (
    <div className="wrap section-sm">
      {/* Header */}
      <div className="card card-pad" style={{ marginBottom:26, background:'linear-gradient(150deg,#FFFFFF,#F8FBF9)' }}>
        <div className="row gap16" style={{ flexWrap:'wrap' }}>
          <div className="avatar avatar-lg" style={{ width:60, height:60, fontSize:20, borderRadius:18 }}>
            {initials(user.org || user.name)}
          </div>
          <div className="grow">
            <div className="row gap10" style={{ flexWrap:'wrap' }}>
              <h1 style={{ fontSize:24, fontWeight:800, letterSpacing:'-.03em' }}>{user.org || user.name}</h1>
              {user.verified
                ? <Badge tone="green"><Icon name="shield" size={11} /> Verified</Badge>
                : <Badge tone="amber">Pending verification</Badge>}
            </div>
            <div className="sm muted" style={{ marginTop:6 }}>
              {user.name} · {user.email} · {user.city}
            </div>
          </div>
          <div className="row gap10">
            {isDonor ? (
              <button className="btn btn-primary" onClick={() => go('/donate')}>
                <Icon name="plus" size={16} /> New donation
              </button>
            ) : (
              <button className="btn btn-primary" onClick={() => go('/browse')}>
                <Icon name="search" size={16} /> Find food
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Stats */}
      <div className="grid-4" style={{ marginBottom:26 }}>
        {stats.map((s, i) => <Stat key={i} {...s} />)}
      </div>

      {/* Tabs */}
      <div className="row gap8" style={{ marginBottom:20, flexWrap:'wrap' }}>
        {[
          ['overview', isDonor ? 'My donations' : 'My claims'],
          ['activity', 'Activity log'],
        ].map(([k, l]) => (
          <div key={k} className={`pill ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}>{l}</div>
        ))}
      </div>

      {tab === 'overview' && (
        <>
          {list.length === 0 ? (
            <EmptyState
              icon={isDonor ? 'package' : 'heart'}
              title={isDonor ? 'You haven\'t listed any food yet' : 'You haven\'t claimed any donations yet'}
              sub={isDonor
                ? 'Turn tonight\'s surplus into tomorrow\'s meals. Listing takes under a minute.'
                : 'Browse live listings in your city and claim food for your community.'}
              action={
                <button className="btn btn-primary" onClick={() => go(isDonor ? '/donate' : '/browse')}>
                  {isDonor ? 'Create your first listing' : 'Browse available food'}
                </button>
              } />
          ) : (
            <div className="stack gap12">
              {list
                .slice()
                .sort((a, b) => b.createdAt - a.createdAt)
                .map(d => {
                  const ft = foodType(d.foodType);
                  const other = users.find(u => u.id === (isDonor ? d.claimedBy : d.donorId));
                  const expired = d.expiresAt < Date.now() && d.status === 'available';
                  return (
                    <div key={d.id} className="lrow" style={{ cursor:'pointer' }} onClick={() => go('/donation/' + d.id)}>
                      <div className="lrow-thumb" style={{ background: ft.grad }}>{ft.emoji}</div>
                      <div className="grow" style={{ minWidth:0 }}>
                        <div className="row gap10" style={{ flexWrap:'wrap' }}>
                          <div style={{ fontWeight:700, fontSize:14.8, letterSpacing:'-.015em' }}>{d.title}</div>
                          <StatusBadge status={d.status} expiresAt={d.expiresAt} />
                        </div>
                        <div className="tiny muted" style={{ marginTop:5 }}>
                          {d.quantity} {d.unit} · ~{d.serves} servings · {d.city}
                          {other && ` · ${isDonor ? 'Claimed by' : 'From'} ${other.org}`}
                        </div>
                      </div>
                      <div className="stack gap4" style={{ alignItems:'flex-end', flexShrink:0 }}>
                        <div className="tiny bold" style={{
                          color: expired ? 'var(--danger)' : d.status === 'available' ? 'var(--brand-700)' : 'var(--muted)',
                        }}>
                          {expired ? 'Expired' : d.status === 'available' ? timeLeft(d.expiresAt) : timeAgo(d.createdAt)}
                        </div>
                        <Icon name="arrow" size={15} style={{ color:'var(--muted-2)' }} />
                      </div>
                    </div>
                  );
                })}
            </div>
          )}
        </>
      )}

      {tab === 'activity' && (
        <div className="card card-pad">
          <div style={{ fontWeight:800, fontSize:16, marginBottom:18 }}>Recent activity</div>
          {(() => {
            const events = [];
            myDonations.forEach(d => {
              events.push({ t: d.createdAt, icon:'plus', tone:'green', text:`Listed “${d.title}”`, sub:`${d.quantity} ${d.unit} · ${d.city}` });
              if (d.claimedAt) {
                const ngo = users.find(u => u.id === d.claimedBy);
                events.push({ t: d.claimedAt, icon:'bell', tone:'amber', text:`Claimed by ${ngo?.org || 'an NGO'}`, sub: d.title });
              }
              if (d.status === 'completed') {
                events.push({ t: d.claimedAt + 3600000, icon:'check', tone:'blue', text:`Delivered — ${d.serves} meals served`, sub: d.title });
              }
            });
            myClaims.forEach(d => {
              if (d.claimedAt) {
                const donor = users.find(u => u.id === d.donorId);
                events.push({ t: d.claimedAt, icon:'heart', tone:'green', text:`You claimed “${d.title}”`, sub: `From ${donor?.org || 'a donor'}` });
              }
              if (d.status === 'completed') {
                events.push({ t: d.claimedAt + 3600000, icon:'check', tone:'blue', text:`Distributed ${d.serves} meals`, sub: d.title });
              }
            });
            events.sort((a, b) => b.t - a.t);

            if (!events.length) {
              return <div className="sm muted">No activity yet. Your actions will appear here.</div>;
            }

            return (
              <div className="stack gap2">
                {events.slice(0, 24).map((e, i) => (
                  <div key={i} className="row gap14" style={{ padding:'13px 0', borderBottom: i < Math.min(events.length, 24) - 1 ? '1px solid var(--line-2)' : 'none' }}>
                    <div style={{ width:34, height:34, borderRadius:11, display:'grid', placeItems:'center', flexShrink:0,
                      background: e.tone === 'green' ? 'var(--brand-50)' : e.tone === 'amber' ? 'var(--accent-50)' : 'var(--blue-50)',
                      color: e.tone === 'green' ? 'var(--brand-700)' : e.tone === 'amber' ? '#B45309' : 'var(--blue)' }}>
                      <Icon name={e.icon} size={15} />
                    </div>
                    <div className="grow">
                      <div style={{ fontSize:14, fontWeight:600 }}>{e.text}</div>
                      <div className="tiny muted" style={{ marginTop:2 }}>{e.sub}</div>
                    </div>
                    <div className="tiny muted" style={{ flexShrink:0 }}>{timeAgo(e.t)}</div>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

/* ============================================================================
   17. PAGE — CREATE DONATION
   ============================================================================ */
function CreateDonationPage({ user }) {
  const toast = useToast();
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [form, setForm] = useState({
    title:'', description:'', foodType:'cooked', diet:'veg',
    quantity:'', unit:'kg', serves:'',
    preparedAt: toLocalInput(Date.now() - HOUR),
    expiresAt:  toLocalInput(Date.now() + 8 * HOUR),
    city: user?.city || 'Mumbai',
    pickupAddress: user?.address || '',
    contactName: user?.name || '',
    contactPhone: user?.phone || '',
    notes:'',
  });

  useEffect(() => {
    if (user) {
      setForm(f => ({
        ...f,
        city: user.city || f.city,
        pickupAddress: user.address || f.pickupAddress,
        contactName: user.name || f.contactName,
        contactPhone: user.phone || f.contactPhone,
      }));
    }
  }, [user?.id]);

  if (!user) { go('/login'); return null; }

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const submit = async e => {
    e.preventDefault();
    setErr('');
    const prepared = new Date(form.preparedAt).getTime();
    const expires = new Date(form.expiresAt).getTime();

    if (isNaN(prepared) || isNaN(expires)) { setErr('Please provide valid prepared and expiry times.'); return; }
    if (expires <= prepared) { setErr('The best-before time must be after the preparation time.'); return; }
    if (expires <= Date.now()) { setErr('The best-before time must be in the future.'); return; }
    if (!Number(form.quantity) || Number(form.quantity) <= 0) { setErr('Please enter a valid quantity.'); return; }
    if (!Number(form.serves) || Number(form.serves) <= 0) { setErr('Please enter the number of people this serves.'); return; }

    setBusy(true);
    try {
      await api.createDonation(user.id, {
        title: form.title.trim(),
        description: form.description.trim(),
        foodType: form.foodType,
        diet: form.diet,
        quantity: Number(form.quantity),
        unit: form.unit,
        serves: Number(form.serves),
        preparedAt: prepared,
        expiresAt: expires,
        city: form.city,
        pickupAddress: form.pickupAddress.trim(),
        contactName: form.contactName.trim(),
        contactPhone: form.contactPhone.trim(),
        notes: form.notes.trim(),
      });
      toast('Donation listed! Nearby NGOs have been notified.', 'success');
      go('/dashboard');
    } catch (ex) {
      toast(ex.message, 'error');
    } finally { setBusy(false); }
  };

  const ft = foodType(form.foodType);

  return (
    <div className="wrap section-sm" style={{ maxWidth: 980 }}>
      <button className="btn btn-ghost btn-sm" onClick={() => go('/dashboard')} style={{ marginBottom:20 }}>
        <Icon name="back" size={16} /> Back to dashboard
      </button>

      <div style={{ marginBottom:26 }}>
        <h1 className="h2">List surplus food</h1>
        <p className="lead" style={{ marginTop:8, fontSize:15.5 }}>
          Accurate details help NGOs plan pickup and distribution. Takes about a minute.
        </p>
      </div>

      <form onSubmit={submit} style={{ display:'grid', gridTemplateColumns:'1.6fr 1fr', gap:24, alignItems:'start' }} className="create-grid">
        <div className="stack gap20">
          {/* Food details */}
          <div className="card card-pad stack gap18">
            <div className="row gap10">
              <div className="feature-icon" style={{ width:38, height:38, borderRadius:11 }}><Icon name="utensils" size={17} /></div>
              <div style={{ fontWeight:800, fontSize:15.5 }}>Food details</div>
            </div>

            <Field label="Listing title">
              <input className="input" required maxLength={80}
                placeholder="e.g. Veg Biryani & Dal — Freshly Cooked"
                value={form.title} onChange={set('title')} />
            </Field>

            <Field label="Description" hint="What's included, how it was stored, anything the NGO should know.">
              <textarea className="textarea" required maxLength={600}
                placeholder="Surplus from our lunch buffet. Kept in insulated containers since 1 PM. Includes jeera rice, dal tadka and mixed vegetable curry."
                value={form.description} onChange={set('description')} />
            </Field>

            <div className="grid-2" style={{ gap:14 }}>
              <Field label="Food type">
                <select className="select" value={form.foodType} onChange={set('foodType')}>
                  {FOOD_TYPES.map(f => <option key={f.id} value={f.id}>{f.emoji} {f.label}</option>)}
                </select>
              </Field>
              <Field label="Dietary classification">
                <select className="select" value={form.diet} onChange={set('diet')}>
                  <option value="veg">🥗 Vegetarian</option>
                  <option value="vegan">🌱 Vegan</option>
                  <option value="nonveg">🍗 Non-Vegetarian</option>
                </select>
              </Field>
            </div>

            <div className="grid-3" style={{ gap:14 }}>
              <Field label="Quantity">
                <input className="input" type="number" min="0.5" step="0.5" required placeholder="18"
                  value={form.quantity} onChange={set('quantity')} />
              </Field>
              <Field label="Unit">
                <select className="select" value={form.unit} onChange={set('unit')}>
                  {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                </select>
              </Field>
              <Field label="Serves (people)">
                <input className="input" type="number" min="1" required placeholder="60"
                  value={form.serves} onChange={set('serves')} />
              </Field>
            </div>
          </div>

          {/* Timing */}
          <div className="card card-pad stack gap18">
            <div className="row gap10">
              <div className="feature-icon" style={{ width:38, height:38, borderRadius:11 }}><Icon name="clock" size={17} /></div>
              <div style={{ fontWeight:800, fontSize:15.5 }}>Timing</div>
            </div>

            <div className="grid-2" style={{ gap:14 }}>
              <Field label="Prepared at">
                <input className="input" type="datetime-local" required
                  value={form.preparedAt} onChange={set('preparedAt')} />
              </Field>
              <Field label="Safe to consume until" hint="Be conservative — this is a food-safety window.">
                <input className="input" type="datetime-local" required
                  value={form.expiresAt} onChange={set('expiresAt')} />
              </Field>
            </div>

            <div className="row gap8" style={{ flexWrap:'wrap' }}>
              <span className="tiny muted bold">Quick set:</span>
              {[['+4h', 4], ['+8h', 8], ['+24h', 24], ['+72h', 72]].map(([l, h]) => (
                <div key={l} className="pill" style={{ padding:'5px 11px', fontSize:12.5 }}
                  onClick={() => setForm(f => ({ ...f, expiresAt: toLocalInput(Date.now() + h * HOUR) }))}>
                  {l}
                </div>
              ))}
            </div>
          </div>

          {/* Pickup */}
          <div className="card card-pad stack gap18">
            <div className="row gap10">
              <div className="feature-icon" style={{ width:38, height:38, borderRadius:11 }}><Icon name="mapPin" size={17} /></div>
              <div style={{ fontWeight:800, fontSize:15.5 }}>Pickup & contact</div>
            </div>

            <Field label="Pickup address">
              <input className="input" required placeholder="14 Marine Drive, Churchgate, Mumbai"
                value={form.pickupAddress} onChange={set('pickupAddress')} />
            </Field>

            <div className="grid-3" style={{ gap:14 }}>
              <Field label="City">
                <select className="select" value={form.city} onChange={set('city')}>
                  {CITIES.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </Field>
              <Field label="Contact person">
                <input className="input" required value={form.contactName} onChange={set('contactName')} />
              </Field>
              <Field label="Contact phone">
                <input className="input" required value={form.contactPhone} onChange={set('contactPhone')} />
              </Field>
            </div>

            <Field label="Additional notes (optional)">
              <input className="input" placeholder="e.g. Pickup from service entrance at the rear."
                value={form.notes} onChange={set('notes')} />
            </Field>
          </div>

          {err && (
            <div style={{ padding:'14px 16px', borderRadius:14, background:'var(--danger-50)', border:'1px solid #FECACA', color:'var(--danger)', fontSize:13.5, fontWeight:600 }}>
              {err}
            </div>
          )}

          <div className="row gap12">
            <button className="btn btn-outline" type="button" onClick={() => go('/dashboard')}>Cancel</button>
            <button className="btn btn-primary btn-lg grow" type="submit" disabled={busy}>
              {busy ? <><Spinner /> Publishing…</> : <><Icon name="plus" size={17} /> Publish donation</>}
            </button>
          </div>
        </div>

        {/* Preview */}
        <div style={{ position:'sticky', top:90 }}>
          <div className="tiny muted bold" style={{ letterSpacing:'.08em', marginBottom:12 }}>LIVE PREVIEW</div>
          <div className="card dc">
            <div className="dc-media" style={{ background: ft.grad }}>
              <span style={{ position:'relative', zIndex:1, filter:'drop-shadow(0 3px 8px rgba(0,0,0,.25))' }}>{ft.emoji}</span>
              <span className="badge tl" style={{ background:'rgba(255,255,255,.94)', color:'var(--ink-2)' }}>
                {form.diet === 'vegan' ? '🌱 Vegan' : form.diet === 'nonveg' ? '🍗 Non-Veg' : '🥗 Veg'}
              </span>
              <span className="tr"><Badge tone="green">Available</Badge></span>
            </div>
            <div className="dc-body">
              <h3 className="dc-title">{form.title || 'Your listing title appears here'}</h3>
              <div className="dc-meta">
                <span><Icon name="package" size={13} /> {form.quantity || '—'} {form.unit}</span>
                <span><Icon name="users" size={13} /> {form.serves || '—'} servings</span>
                <span><Icon name="mapPin" size={13} /> {form.city}</span>
              </div>
              <div className="dc-foot">
                <div className="tiny muted semibold">{user.org}</div>
                <div className="row gap4" style={{ fontSize:12.5, fontWeight:700, color:'var(--brand-700)' }}>
                  <Icon name="clock" size={13} /> {timeLeft(new Date(form.expiresAt).getTime() || Date.now())}
                </div>
              </div>
            </div>
          </div>

          <div className="card card-pad" style={{ marginTop:16, background:'var(--brand-50)', borderColor:'#BBF7D0' }}>
            <div className="row gap8" style={{ color:'var(--brand-700)', fontWeight:800, fontSize:13.5 }}>
              <Icon name="sparkles" size={15} /> Estimated impact
            </div>
            <div className="stack gap9" style={{ marginTop:13 }}>
              {[
                ['Meals provided', `~${form.serves || 0}`],
                ['Food rescued', `${form.quantity || 0} ${form.unit}`],
                ['CO₂ avoided', `~${Math.round((Number(form.quantity) || 0) * 2.5)} kg`],
              ].map(([k, v]) => (
                <div key={k} className="between" style={{ fontSize:13 }}>
                  <span className="muted">{k}</span>
                  <span style={{ fontWeight:800, color:'var(--brand-700)' }}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="card card-pad" style={{ marginTop:16 }}>
            <div className="row gap8" style={{ fontWeight:700, fontSize:13.5, marginBottom:10 }}>
              <Icon name="shield" size={15} style={{ color:'var(--brand-700)' }} /> Food safety checklist
            </div>
            <div className="stack gap8">
              {[
                'Food kept at safe temperature throughout',
                'Not previously served or plated',
                'Containers sealed and clean',
                'Honest expiry window provided',
              ].map(t => (
                <div key={t} className="row gap8 sm muted" style={{ lineHeight:1.5 }}>
                  <Icon name="check" size={14} style={{ color:'var(--brand)', flexShrink:0, marginTop:2 }} />
                  {t}
                </div>
              ))}
            </div>
          </div>
        </div>
      </form>

      <style>{`
        @media(max-width:940px){ .create-grid{grid-template-columns:1fr!important} }
        @media(max-width:640px){ .why-grid{grid-template-columns:1fr!important;gap:34px!important} }
        @media(max-width:860px){ .footer-grid{grid-template-columns:1fr 1fr!important} }
        @media(max-width:560px){ .footer-grid{grid-template-columns:1fr!important} .hero-stats{grid-template-columns:1fr 1fr!important} }
      `}</style>
    </div>
  );
}

/* ============================================================================
   18. PAGE — PROFILE
   ============================================================================ */
function ProfilePage({ user }) {
  const toast = useToast();
  const [form, setForm] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (user) setForm({
      name: user.name, org: user.org, phone: user.phone,
      city: user.city, address: user.address, bio: user.bio || '',
    });
  }, [user?.id]);

  if (!user) { go('/login'); return null; }
  if (!form) return null;

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const save = async e => {
    e.preventDefault();
    setBusy(true);
    await api.updateProfile(user.id, form);
    toast('Profile updated successfully.', 'success');
    setBusy(false);
  };

  return (
    <div className="wrap section-sm" style={{ maxWidth: 760 }}>
      <h1 className="h2" style={{ marginBottom:8 }}>Your profile</h1>
      <p className="lead" style={{ marginBottom:28, fontSize:15.5 }}>
        This information appears on your listings and claims.
      </p>

      <div className="card card-pad" style={{ marginBottom:22 }}>
        <div className="row gap16">
          <div className="avatar avatar-lg" style={{ width:64, height:64, fontSize:21, borderRadius:20 }}>
            {initials(form.org || form.name)}
          </div>
          <div className="grow">
            <div style={{ fontSize:18, fontWeight:800, letterSpacing:'-.02em' }}>{form.org}</div>
            <div className="sm muted" style={{ marginTop:4 }}>{user.email}</div>
            <div className="row gap8" style={{ marginTop:10, flexWrap:'wrap' }}>
              <Badge tone={user.role === 'ngo' ? 'blue' : 'green'}>
                {user.role === 'ngo' ? 'NGO Partner' : 'Food Donor'}
              </Badge>
              {user.verified
                ? <Badge tone="green"><Icon name="shield" size={11} /> Verified</Badge>
                : <Badge tone="amber">Verification pending</Badge>}
              {user.regNo && <Badge tone="gray">{user.regNo}</Badge>}
            </div>
          </div>
        </div>
      </div>

      <form onSubmit={save} className="card card-pad stack gap18">
        <div className="grid-2" style={{ gap:14 }}>
          <Field label="Contact name">
            <input className="input" value={form.name} onChange={set('name')} />
          </Field>
          <Field label="Organisation">
            <input className="input" value={form.org} onChange={set('org')} />
          </Field>
        </div>

        <div className="grid-2" style={{ gap:14 }}>
          <Field label="Phone">
            <input className="input" value={form.phone} onChange={set('phone')} />
          </Field>
          <Field label="City">
            <select className="select" value={form.city} onChange={set('city')}>
              {CITIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
        </div>

        <Field label="Address">
          <input className="input" value={form.address} onChange={set('address')} />
        </Field>

        <Field label="About" hint="A short description shown to partners.">
          <textarea className="textarea" value={form.bio} onChange={set('bio')} maxLength={300}
            placeholder="Tell NGOs about your kitchen, capacity or mission." />
        </Field>

        <div className="row gap12">
          <button className="btn btn-primary" type="submit" disabled={busy}>
            {busy ? <><Spinner /> Saving…</> : <><Icon name="check" size={16} /> Save changes</>}
          </button>
          <button className="btn btn-outline" type="button" onClick={() => go('/dashboard')}>Back</button>
        </div>
      </form>
    </div>
  );
}

/* ============================================================================
   19. PAGE — ABOUT
   ============================================================================ */
function AboutPage() {
  return (
    <div>
      <section className="hero">
        <div className="wrap hero-inner" style={{ padding:'64px 0 72px' }}>
          <div className="hero-badge"><Icon name="sparkles" size={14} /> How FoodBridge works</div>
          <h1 className="h1" style={{ marginTop:22, maxWidth:720, fontSize:'clamp(30px,4.2vw,46px)' }}>
            A bridge between <span className="hero-grad">too much food</span> and not enough.
          </h1>
          <p className="lead" style={{ marginTop:18, maxWidth:600, color:'#A9C2B8', fontSize:16.5 }}>
            FoodBridge is a free marketplace where surplus food finds its way to people who need it —
            safely, quickly and with a full audit trail.
          </p>
        </div>
      </section>

      <section className="section">
        <div className="wrap">
          <div className="grid-3">
            {[
              { i:'utensils', t:'For Donors', d:'Restaurants, hotels, caterers, corporate cafeterias and individuals with surplus food. List it in under a minute with quantity, dietary info and a safe consumption window.' },
              { i:'heart', t:'For NGOs', d:'Verified charitable organisations with the logistics to collect and distribute. Browse live listings by city, claim what you can move, and coordinate pickup directly.' },
              { i:'shield', t:'Trust & Safety', d:'Every NGO is screened with registration numbers. Donors confirm food was never plated or previously served. Expiry windows are enforced automatically.' },
            ].map((c, i) => (
              <div key={c.t} className="card card-pad card-hover reveal" style={{ animationDelay: `${i*70}ms` }}>
                <div className="feature-icon" style={{ marginBottom:16 }}><Icon name={c.i} size={21} /></div>
                <div style={{ fontSize:16.5, fontWeight:800, letterSpacing:'-.02em' }}>{c.t}</div>
                <p className="sm muted" style={{ marginTop:10, lineHeight:1.68 }}>{c.d}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="section" style={{ background:'#fff', borderTop:'1px solid var(--line)', borderBottom:'1px solid var(--line)' }}>
        <div className="wrap" style={{ maxWidth:820 }}>
          <div className="eyebrow">The problem</div>
          <h2 className="h2" style={{ marginTop:12 }}>
            One third of all food produced is wasted. Millions still go hungry.
          </h2>
          <p className="lead" style={{ marginTop:18 }}>
            India wastes roughly 68 million tonnes of food each year — enough to feed a large part of
            its population. Meanwhile, restaurants and banquet halls discard kilograms of perfectly safe,
            freshly cooked food every single evening because there's no efficient way to move it.
          </p>
          <p className="lead" style={{ marginTop:16 }}>
            The barrier isn't goodwill. It's logistics and trust. FoodBridge solves both: a live marketplace
            where surplus is listed in seconds and verified NGOs claim it in one tap, with all the
            information needed for a safe, same-day handover.
          </p>

          <div className="grid-2" style={{ marginTop:36 }}>
            {[
              ['68M tonnes', 'food wasted annually in India'],
              ['~190M', 'people who could be fed by that surplus'],
              ['2.5 kg CO₂', 'avoided per kilogram of food rescued'],
              ['< 2 hours', 'typical time from listing to NGO claim'],
            ].map(([n, l]) => (
              <div key={n} className="card card-pad">
                <div style={{ fontSize:26, fontWeight:800, letterSpacing:'-.035em', color:'var(--brand-700)' }}>{n}</div>
                <div className="sm muted" style={{ marginTop:6, lineHeight:1.55 }}>{l}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="section">
        <div className="wrap">
          <div style={{ textAlign:'center', marginBottom:44 }}>
            <div className="eyebrow">Food safety first</div>
            <h2 className="h2" style={{ marginTop:12 }}>Guidelines every listing follows</h2>
          </div>
          <div className="grid-2" style={{ maxWidth:900, margin:'0 auto' }}>
            {[
              ['Never previously served', 'Food must come straight from the kitchen or buffet line — never from a plate a guest has touched.'],
              ['Temperature maintained', 'Hot food held above 60°C, cold food below 4°C, from preparation through pickup.'],
              ['Realistic expiry windows', 'Donors set the safe consumption deadline. Expired listings are automatically withdrawn.'],
              ['Sealed and clean containers', 'Food-grade containers, covered and labelled, ready for immediate transfer.'],
              ['Transparent contact', 'Both parties see names, phone numbers and the pickup address before collection.'],
              ['Traceable delivery', 'Every donation is closed out with a delivery confirmation and impact record.'],
            ].map(([t, d], i) => (
              <div key={t} className="row gap14" style={{ alignItems:'flex-start', padding:'18px 0', borderBottom:'1px solid var(--line-2)' }}>
                <div style={{ width:32, height:32, borderRadius:10, background:'var(--brand-50)', border:'1px solid #BBF7D0', color:'var(--brand-700)', display:'grid', placeItems:'center', flexShrink:0, fontWeight:800, fontSize:13 }}>
                  {i + 1}
                </div>
                <div>
                  <div style={{ fontWeight:700, fontSize:15 }}>{t}</div>
                  <div className="sm muted" style={{ marginTop:5, lineHeight:1.62 }}>{d}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="wrap" style={{ paddingBottom:80 }}>
        <div className="cta-band">
          <h2 className="h2" style={{ color:'#fff', maxWidth:560, margin:'0 auto' }}>
            Ready to bridge the gap?
          </h2>
          <p className="lead" style={{ color:'#A9C2B8', marginTop:14, maxWidth:460, marginInline:'auto' }}>
            It takes less than a minute to get started, and it's completely free.
          </p>
          <div className="row gap12 center" style={{ marginTop:30, flexWrap:'wrap' }}>
            <button className="btn btn-primary btn-lg" onClick={() => go('/register')}>
              Create your account <Icon name="arrow" size={16} />
            </button>
            <button className="btn btn-ghost-light btn-lg" onClick={() => go('/browse')}>
              Browse listings
            </button>
          </div>
        </div>
      </section>
    </div>
  );
}

/* ============================================================================
   20. ROOT APP
   ============================================================================ */
function App() {
  const state = useStore();
  const { path, parts } = useRoute();

  const user = useMemo(
    () => state.users.find(u => u.id === state.session) || null,
    [state.users, state.session]
  );

  // Protect routes
  useEffect(() => {
    const protectedPaths = ['/dashboard', '/donate', '/profile'];
    if (protectedPaths.includes(path) && !user) go('/login');
  }, [path, user]);

  // Auth pages render without chrome
  if (path === '/login')    return <ToastProvider><LoginPage /></ToastProvider>;
  if (path === '/register') return <ToastProvider><RegisterPage /></ToastProvider>;

  let page;
  if (path === '/' || path === '') {
    page = <HomePage user={user} donations={state.donations} users={state.users} />;
  } else if (parts[0] === 'browse') {
    page = <BrowsePage donations={state.donations} users={state.users} user={user} />;
  } else if (parts[0] === 'donation' && parts[1]) {
    page = <DonationDetailPage id={parts[1]} donations={state.donations} users={state.users} user={user} />;
  } else if (path === '/dashboard') {
    page = <DashboardPage user={user} donations={state.donations} users={state.users} claims={state.claims} />;
  } else if (path === '/donate') {
    page = <CreateDonationPage user={user} />;
  } else if (path === '/profile') {
    page = <ProfilePage user={user} />;
  } else if (path === '/about') {
    page = <AboutPage />;
  } else {
    page = (
      <div className="wrap section">
        <EmptyState icon="alert" title="Page not found"
          sub="The page you're looking for doesn't exist or has moved."
          action={<button className="btn btn-primary" onClick={() => go('/')}>Back to home</button>} />
      </div>
    );
  }

  return (
    <ToastProvider>
      <Navbar user={user} />
      <main style={{ minHeight:'62vh' }} key={path}>{page}</main>
      <Footer />
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
